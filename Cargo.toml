[package]
name = "gbb"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Cargo build broker: per-build-dir locks, memory-aware slots, and job dedupe so parallel agents never block each other"
license = "MIT"
readme = "README.md"
repository = "https://github.com/harunjeylan/gbb"
keywords = ["cargo", "build", "parallel", "agents", "lock"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]

[profile.release]
opt-level = 2
lto = "thin"
strip = true
